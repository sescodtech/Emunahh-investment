<meta name="theme-color" content="#0d0a64"/><title>Emunahh-Invest Limited</title></head>
<body>
<div id="initial-loader" aria-label="Loading Emunahh-Invest"><div class="initial-loader-ring"><div class="initial-loader-mark">EI</div></div><div class="initial-loader-name">EMUNAHH-INVEST</div><div class="initial-loader-dots"><i></i><i></i><i></i></div></div><style>#initial-loader{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:12px;background:linear-gradient(180deg,#f7f9fc 0%,#fff 55%,#f7f9fc 100%);font-family:Arial,sans-serif;transition:opacity .35s ease,visibility .35s ease}#initial-loader.loaded{opacity:0;visibility:hidden;pointer-events:none}.initial-loader-ring{width:86px;height:86px;border-radius:999px;display:grid;place-items:center;background:#fff;border:1px solid rgba(13,10,100,.1);box-shadow:0 14px 45px rgba(13,10,100,.1);position:relative}.initial-loader-ring:before{content:"";position:absolute;inset:3px;border-radius:999px;border:2px solid transparent;border-top-color:#e7020b;border-right-color:#0d0a64;animation:initialSpin 1s linear infinite}.initial-loader-mark{font-size:19px;font-weight:900;letter-spacing:-.08em;color:#0d0a64}.initial-loader-mark:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e7020b;margin-left:2px}.initial-loader-name{font-size:10px;font-weight:900;letter-spacing:.28em;color:#0d0a64;margin-left:.28em}.initial-loader-dots{display:flex;gap:6px}.initial-loader-dots i{width:5px;height:5px;border-radius:50%;background:#e7020b;animation:initialBounce .9s ease-in-out infinite}.initial-loader-dots i:nth-child(2){background:#0d0a64;animation-delay:.12s}.initial-loader-dots i:nth-child(3){animation-delay:.24s}@keyframes initialSpin{to{transform:rotate(360deg)}}@keyframes initialBounce{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-4px);opacity:1}}</style><script>window.addEventListener('load',function(){var e=document.getElementById('initial-loader');if(e){e.classList.add('loaded');setTimeout(function(){e.remove()},450)}})</script>
